name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validated-windows:
    name: Validate and build Windows release
    uses: ./.github/workflows/windows-build.yml

  # Keep the existing native Linux/macOS build capability available on demand.
  # The hardware-confirmed Windows SPP baseline remains unchanged; official download targets Windows x64.
  build-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - run: make build-linux
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/nelko-print-linux-amd64.tar.gz nelko-print README.md LICENSE CHANGELOG.md ROADMAP.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*

  build-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: make build-macos
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/nelko-print-macos-arm64.tar.gz nelko-print README.md LICENSE CHANGELOG.md ROADMAP.md
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*

  release:
    name: Publish official Windows release
    needs: validated-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version tag from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -s "docs/RELEASE-${GITHUB_REF_NAME}.md"
      - name: Download tested Windows build
        uses: actions/download-artifact@v4
        with:
          name: NELKO-P21-ASK-Edition-${{ github.ref_name }}-windows-amd64
          path: release-assets
      - name: Extract standalone EXE and generate checksums
        run: |
          set -euo pipefail
          asset="NELKO-P21-ASK-Edition-${GITHUB_REF_NAME}-windows-amd64"
          unzip -q "release-assets/${asset}.zip" -d release-package
          cp "release-package/${asset}.exe" release-assets/
          file "release-assets/${asset}.exe" | grep -E 'PE32\+.*GUI.*x86-64'
          cd release-assets
          sha256sum "${asset}.exe" "${asset}.zip" > SHA256SUMS.txt
      - name: Publish EXE, ZIP and checksums
        uses: softprops/action-gh-release@v2
        with:
          name: NELKO P21 – ASK Edition ${{ github.ref_name }}
          body_path: docs/RELEASE-${{ github.ref_name }}.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/NELKO-P21-ASK-Edition-${{ github.ref_name }}-windows-amd64.exe
            release-assets/NELKO-P21-ASK-Edition-${{ github.ref_name }}-windows-amd64.zip
            release-assets/SHA256SUMS.txt
